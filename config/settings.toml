# Copia del respaldo fuera del disco del servidor: si el disco del VPS falla,
# los respaldos locales se pierden todos a la vez.
#
# `comando` recibe la ruta del respaldo en {archivo}. Para OneDrive de Office
# 365 se usa rclone, que no exige registrar la aplicacion en Azure:
#   1. apt install rclone   (en el VPS)
#   2. rclone config  -> new remote -> onedrive -> seguir el asistente
#   3. activo = true
# Tambien sirve para otro servidor:  comando = "scp {archivo} usuario@host:/ruta/"
[respaldo_externo]
activo = false
comando = "rclone copy {archivo} onedrive:Respaldos Expresangil"
horas = 24
